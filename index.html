<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Unit 30 · Body and Lifestyle · E8 Trainer</title><style>
:root{--ink:#193753;--muted:#647f91;--accent:#246f9a;--accent2:#33a7b5;--pale:#eaf7fc;--light:#f5fafc;--line:#d9e7ef;--green:#19805b;--greenbg:#ecf8f1;--red:#a3443e;--redbg:#fff1ef;--shadow:0 12px 40px rgba(22,60,84,.08)}
*{box-sizing:border-box} body{margin:0;color:var(--ink);font-family:Inter,system-ui,-apple-system,'Segoe UI',Arial,sans-serif;background:linear-gradient(155deg,#e8f8fc 0%,#f9fcfd 45%,#edf5f9 100%);min-height:100vh} button,input{font:inherit} button{cursor:pointer} button:focus-visible,input:focus-visible{outline:3px solid #46a6db;outline-offset:2px} button:disabled{opacity:.5;cursor:not-allowed} .shell{width:min(960px,calc(100% - 24px));margin:22px auto 46px}.mast{background:linear-gradient(112deg,#174564,#247a9b);color:white;border-radius:23px;padding:25px 30px;box-shadow:var(--shadow);position:relative;overflow:hidden}.mast:before{content:'✚';position:absolute;right:32px;top:4px;color:#b4f0e6;font-size:112px;opacity:.12;transform:rotate(-12deg)}.eyebrow{font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:12px;color:#b0e9f1}.mast h1{margin:10px 0 7px;font-size:clamp(29px,5vw,43px);line-height:1.08;letter-spacing:-.035em}.mast p{margin:0;font-size:15px;color:#d8f4f7;line-height:1.55}.heading{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 11px}.tabs{display:flex;gap:10px;flex-wrap:wrap}.mode{border:1px solid #b8dae8;background:white;padding:12px 17px;border-radius:14px;font-size:14px;color:var(--ink);font-weight:800}.mode.active{background:#daf0f8;border-color:#2f83a3;color:#105a75}.outline-btn{border:1px solid #c4dae6;background:#fff;padding:11px 15px;border-radius:12px;color:var(--ink);font-weight:750}.small{font-size:13px;color:var(--muted)}.info{background:#f2fbfd;border:1px solid var(--line);border-radius:14px;padding:12px 16px;color:#476579;line-height:1.55;margin-bottom:14px}.body{background:white;border:1px solid var(--line);border-radius:21px;box-shadow:var(--shadow);padding:24px 26px}.progress{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:0 0 21px}.rail{flex:1;background:#e4f1f6;height:9px;border-radius:999px;overflow:hidden}.fill{height:100%;background:linear-gradient(90deg,#2d8bb0,#40b8a8);width:0;transition:width .25s ease}.pill{background:#edf7fa;border:1px solid #d3e8f0;color:#216487;border-radius:999px;padding:6px 11px;display:inline-block;text-transform:uppercase;font-size:11px;font-weight:850;letter-spacing:.07em}.qtitle{font-size:clamp(19px,2.7vw,24px);font-weight:850;line-height:1.45;white-space:pre-line;margin:18px 0 18px}.options{display:grid;gap:11px;margin-top:10px}.option{display:flex;gap:14px;align-items:flex-start;background:#fff;border:1px solid #d0e2ea;border-radius:14px;padding:15px;cursor:pointer;line-height:1.45;transition:background .15s,border-color .15s}.option:hover{background:#f3fbfe;border-color:#80bed0}.option:has(input:checked){background:#e5f6fa;border-color:#2a88a5}.option input{margin:3px 0 0;accent-color:#287a9c;transform:scale(1.12)}.optletter{font-weight:900;color:#246f94;min-width:20px}.typein{width:100%;font-size:17px;border:1px solid #a7c6d8;border-radius:13px;background:#f8fcfe;padding:14px 16px;color:var(--ink)}.under{color:var(--muted);font-size:13px;margin-top:9px}.act{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:21px}.btn{border:1px solid var(--line);border-radius:12px;padding:12px 17px;background:white;color:var(--ink);font-weight:800}.primary{background:#237c9c;color:white;border-color:#237c9c}.primary:hover{background:#1a6887}.box-note{margin-top:15px;padding:15px 17px;border:1px solid #cde2ef;border-radius:14px;background:#f1f9fc;line-height:1.5}.box-note.good{background:var(--greenbg);border-color:#bfe8cf;color:var(--green)}.box-note.bad{background:var(--redbg);border-color:#f0c7c1;color:var(--red)}.box-note strong{display:block;margin-bottom:5px}.hidden{display:none!important}.summary{text-align:center;margin:6px 0 16px}.summary h2{margin:8px 0}.bigscore{font-size:clamp(42px,8vw,66px);font-weight:900;letter-spacing:-.07em;color:#176e8a}.sub{font-size:14px;color:#617c8b;line-height:1.55}.results-list{display:grid;gap:12px;margin-top:23px}.review{background:#fbfdff;border:1px solid #d7e9f1;border-radius:13px;padding:15px}.review .review-title{font-weight:800;white-space:pre-line;line-height:1.48}.review .review-line{margin-top:8px;line-height:1.48;font-size:14px}.your{color:#647f91}.answer{color:#1b785a}.wrong{color:#bd5149}.mark{border:1px solid #98cbb5;color:#136e4e;background:#ecf8f0;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:750;margin-top:10px}.footer{text-align:center;font-size:13px;color:#698092;margin:19px}.topmeta{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.navarea{margin-top:15px;display:flex;gap:8px;flex-wrap:wrap}.mono{font-variant-numeric:tabular-nums;font-weight:850} .mode-text{margin-bottom:0} .footline{margin-top:20px;font-size:12px;color:#7c91a1} @media(max-width:580px){.shell{width:calc(100% - 14px);margin:9px auto}.mast{padding:23px 19px}.body{padding:19px 15px}.tabs{width:100%}.mode{flex:1;padding:12px 9px}.heading{margin:13px 0 10px}.qtitle{margin:15px 0;font-size:19px}.btn{flex:1}.option{padding:13px 11px;gap:10px}.progress{gap:7px}}
</style></head><body>
<main class="shell">
  <header class="mast"><div class="eyebrow">Destination B1 · Unit 30 · E8</div><h1>Body and Lifestyle</h1><p>Vocabulary · phrasal verbs · word patterns · word formation · exam language</p></header>
  <div class="heading"><div class="tabs" role="group" aria-label="Choose mode"><button type="button" id="tabPractice" class="mode active">✦ Practice Mode</button><button type="button" id="tabExam" class="mode">◎ Exam Mode</button></div><button class="outline-btn" id="restart" type="button">↻ Restart</button></div>
  <div class="info" id="modeNote">Practice Mode: hints, instant checking, explanations and accepted alternative answers.</div>
  <section id="questionCard" class="body" aria-live="polite">
    <div class="progress"><div class="rail"><div class="fill" id="progressFill"></div></div><span class="small mono" id="counter"></span></div>
    <div class="topmeta"><span id="category" class="pill"></span><span class="small" id="qType"></span></div>
    <div id="prompt" class="qtitle"></div>
    <div id="answerArea"></div>
    <div id="hintBox" class="box-note hidden"></div>
    <div id="feedbackBox" class="box-note hidden"></div>
    <div class="act"><button id="hintBtn" class="btn" type="button">Show hint</button><button id="backBtn" class="btn hidden" type="button">← Previous</button><button id="checkBtn" class="btn primary" type="button">Check answer</button><button id="skipBtn" class="btn hidden" type="button">Skip</button><button id="nextBtn" class="btn primary hidden" type="button">Next →</button></div>
  </section>
  <section id="endCard" class="body hidden" aria-live="polite"><div id="result"></div></section>
  <p class="footer">Learn · Practise · Progress — Original questions for Unit 30</p>
</main>
<script>
const practiceBank=[{"type":"mc","category":"Vocabulary","prompt":"The instructions say this cereal ___ milk powder, so Adam can’t eat it.","options":["suffers from","contains","recovers from"],"answer":1,"hint":"We use this verb to say that something is inside a product.","explanation":"“Contains” tells us what a food product has in it."},{"type":"mc","category":"Vocabulary","prompt":"The cut on her finger wasn’t deep and should ___ quickly.","options":["heal","stir","spread"],"answer":0,"hint":"Think about what an injury does as it gets better.","explanation":"A wound can “heal”; a person “recovers” from an illness."},{"type":"mc","category":"Vocabulary","prompt":"That lemonade tastes very ___ because you added so much lemon juice.","options":["sour","spicy","raw"],"answer":0,"hint":"How would you describe the sharp taste of a lemon?","explanation":"Lemons are sour. Chilli is spicy."},{"type":"mc","category":"Vocabulary","prompt":"Ben felt ___ after standing in a hot, crowded room and needed to sit down.","options":["bitter","dizzy","frozen"],"answer":1,"hint":"He feels as if he may lose his balance.","explanation":"“Dizzy” describes feeling unsteady or as if you might faint."},{"type":"mc","category":"Vocabulary","prompt":"Cycling regularly has really improved my ___.","options":["infection","fitness","recipe"],"answer":1,"hint":"It means your physical condition.","explanation":"“Fitness” is your ability to do physical activity."},{"type":"mc","category":"Phrasal verbs","prompt":"After reading about nutrition, Tom decided to ___ energy drinks.","options":["cut down on","put on","get over"],"answer":0,"hint":"He wants to consume fewer of them.","explanation":"“Cut down on” means reduce the amount you consume."},{"type":"mc","category":"Phrasal verbs","prompt":"Nadia is back at school now. She has finally ___ her stomach bug.","options":["fallen down","got over","gone off"],"answer":1,"hint":"She is no longer ill.","explanation":"“Get over” an illness means recover from it."},{"type":"mc","category":"Phrasal verbs","prompt":"I wouldn’t eat those sandwiches. They smell as though they’ve ___.","options":["gone off","put on","cut down"],"answer":0,"hint":"The food is no longer fresh.","explanation":"Food that has “gone off” has become bad or unsafe to eat."},{"type":"mc","category":"Phrasal verbs","prompt":"Before going out into the cold, please ___ your warm jumper.","options":["lie down","put on","get over"],"answer":1,"hint":"You wear it.","explanation":"“Put on” is used for clothes."},{"type":"text","category":"Phrasal verbs","prompt":"After a long hike, Dad told us to _____ for ten minutes and rest our legs. (two words)","answers":["lie down"],"hint":"Use the phrasal verb meaning rest in a horizontal position.","explanation":"“Lie down” = move into a lying position."},{"type":"mc","category":"Word patterns","prompt":"The new vaccine may help protect patients ___ certain infections.","options":["for","from","at"],"answer":1,"hint":"Which preposition follows “protect someone … something”?","explanation":"We say “protect someone from something”."},{"type":"text","category":"Word patterns","prompt":"My brother takes good care _____ his teeth. (one word)","answers":["of"],"hint":"The fixed phrase is “take care …”.","explanation":"“Take care of” = look after."},{"type":"mc","category":"Word patterns","prompt":"It’s best to avoid ___ a heavy meal immediately before swimming.","options":["eat","to eat","eating"],"answer":2,"hint":"After “avoid”, we use the -ing form.","explanation":"We say “avoid doing something”."},{"type":"text","category":"Word patterns","prompt":"This medicine had almost no effect _____ the pain. (one word)","answers":["on"],"hint":"Think “have an effect … something”.","explanation":"The correct phrase is “have an effect on”."},{"type":"text","category":"Word patterns","prompt":"Fresh vegetables are good _____ your health. (one word)","answers":["for"],"hint":"What preposition follows “good” when something is beneficial?","explanation":"We say “good for your health”."},{"type":"text","category":"Word formation","prompt":"The explanation was so __________ that half the class misunderstood it. (CONFUSE)","answers":["confusing"],"hint":"Do the students feel confused, or does the explanation cause confusion?","explanation":"An explanation is “confusing”; students are “confused”."},{"type":"text","category":"Word formation","prompt":"My grandmother tries to eat __________ and go for a walk every day. (HEALTH)","answers":["healthily"],"hint":"You need an adverb describing “eat”.","explanation":"“Healthily” is the adverb from “healthy”."},{"type":"text","category":"Word formation","prompt":"The doctor recommended a different __________ for his skin problem. (TREAT)","answers":["treatment"],"hint":"You need a noun after “a different”.","explanation":"“Treatment” = medical care or something used to help an illness."},{"type":"text","category":"Word formation","prompt":"The nurse checked my __________ during my appointment. (WEIGH)","answers":["weight"],"hint":"You need a noun describing how heavy someone is.","explanation":"“Weight” is the noun formed from “weigh”."},{"type":"text","category":"Translation","prompt":"You should (więcej odpoczywać) __________ before the competition.","answers":["rest more","get more rest","take more rest"],"hint":"Translate only the fragment, not the whole sentence.","explanation":"“Rest more” or “get more rest” fits naturally after “should”."},{"type":"text","category":"Translation","prompt":"Mum asked me to (sprawdzić datę ważności) __________ on the carton.","answers":["check the expiry date","check the expiration date","check the use by date","check the use-by date"],"hint":"This date tells you how long a product is safe or suitable to use.","explanation":"“Check the expiry date” is standard British English; “expiration date” is also fine."},{"type":"text","category":"Translation","prompt":"After the cycling race, (bolały ją nogi) __________.","answers":["her legs hurt","her legs were sore","she had sore legs"],"hint":"You can use “hurt” or “sore”.","explanation":"All three options express the same idea naturally."},{"type":"mc","category":"Language functions","prompt":"— My eyes hurt after hours of revision. What should I do?\n— ___","options":["You could take a short break from the screen.","Have you seen my new timetable?","I’ve already done the revision."],"answer":0,"hint":"Find advice that directly addresses the problem.","explanation":"Giving an appropriate suggestion is the communicative skill here."},{"type":"mc","category":"Language functions","prompt":"— Could you check if these biscuits contain eggs?\n— ___","options":["They’re on special offer today.","Of course. Let me read the label.","They’re made in another country."],"answer":1,"hint":"Which response acknowledges the request and offers to check?","explanation":"“Of course. Let me read the label” answers the request."},{"type":"mc","category":"Language functions","prompt":"— This soup is a bit too salty.\n— ___","options":["Try adding more salt.","It’s made from fresh vegetables.","Would you like me to bring you something else?"],"answer":2,"hint":"Choose the helpful response to a complaint.","explanation":"Offering a replacement is an appropriate response."}];
const examBank=[{"type":"mc","category":"Vocabulary","prompt":"The warning says this cream can cause an allergic ___.","options":["recipe","reaction","temperature"],"answer":1},{"type":"mc","category":"Vocabulary","prompt":"Be careful when you cut the carrots. That knife is very ___.","options":["sharp","sour","spicy"],"answer":0},{"type":"mc","category":"Vocabulary","prompt":"Theo has an upset stomach. He should probably avoid ___ food tonight.","options":["heavy","frozen","wooden"],"answer":0},{"type":"mc","category":"Phrasal verbs","prompt":"Could you ___ your muddy shoes before coming inside?","options":["get over","take off","go off"],"answer":1},{"type":"text","category":"Phrasal verbs","prompt":"These strawberries have __________. They smell strange and taste awful. (two words)","answers":["gone off"]},{"type":"text","category":"Phrasal verbs","prompt":"Olivia wants to __________ on sweets before her next dentist appointment. (two words)","answers":["cut down"]},{"type":"text","category":"Phrasal verbs","prompt":"If you feel faint, sit or lie __________ immediately. (one word)","answers":["down"]},{"type":"text","category":"Word patterns","prompt":"My uncle has been suffering __________ a back problem. (one word)","answers":["from"]},{"type":"text","category":"Word patterns","prompt":"A lot of packaged snacks are high __________ sugar. (one word)","answers":["in"]},{"type":"text","category":"Word patterns","prompt":"This dish is suitable __________ vegetarians. (one word)","answers":["for"]},{"type":"text","category":"Word formation","prompt":"A __________ diet includes a variety of different foods. (BALANCE)","answers":["balanced"]},{"type":"text","category":"Word formation","prompt":"Gentle exercise can improve muscle __________. (STRONG)","answers":["strength"]},{"type":"text","category":"Translation","prompt":"Take the pan off the heat before the water (zacznie wrzeć) __________.","answers":["starts boiling","starts to boil","begins boiling","begins to boil"]},{"type":"text","category":"Translation","prompt":"I can’t have that snack because (zawiera orzeszki ziemne) __________.","answers":["it contains peanuts","it has peanuts","it contains groundnuts"]},{"type":"text","category":"Transformation","prompt":"Milk causes an allergic reaction in Lena. (ALLERGIC)\nLena __________ milk.","answers":["is allergic to"]},{"type":"text","category":"Transformation","prompt":"My cold hasn’t completely disappeared yet. (OVER)\nI haven’t __________ my cold yet.","answers":["got over","gotten over"]},{"type":"mc","category":"Language functions","prompt":"— Can I have the dressing separately, please?\n— ___","options":["Certainly. I’ll bring it on the side.","It was made yesterday.","The kitchen closes at eight."],"answer":0},{"type":"mc","category":"Language functions","prompt":"— I feel much better today, so I’m thinking of training again.\n— ___","options":["The training kit is blue.","That’s good, but don’t push yourself too hard.","Do you like yesterday’s lunch?"],"answer":1}];
let mode='practice', idx=0, score=0, answered=false, hintCount=0, examAnswers=[], overrides={};
const $=id=>document.getElementById(id);
const norm=s=>String(s??'').trim().toLowerCase().normalize('NFKC').replace(/[’‘]/g,"'").replace(/[.,!?;:]+$/g,'').replace(/\s+/g,' ');
const list=()=>mode==='practice'?practiceBank:examBank;
function isCorrect(q,value){if(value===null||typeof value==='undefined'||String(value).trim()==='')return false;if(q.type==='mc')return Number(value)===q.answer;return q.answers.some(a=>norm(a)===norm(value));}
function correctAnswer(q){return q.type==='mc'?q.options[q.answer]:q.answers.join(' / ')}
function selected(){const q=list()[idx];if(q.type==='mc'){const radio=document.querySelector('input[name="choice"]:checked');return radio?Number(radio.value):null;}return $('userInput').value.trim();}
function reset(newMode=mode){mode=newMode;idx=0;score=0;answered=false;hintCount=0;examAnswers=[];overrides={};$('tabPractice').classList.toggle('active',mode==='practice');$('tabExam').classList.toggle('active',mode==='exam');$('modeNote').textContent=mode==='practice'?'Practice Mode: 25 new questions, helpful hints, instant feedback and explanations.':'Exam Mode: 18 different questions, no hints and no feedback until the end. You may return to earlier questions.';$('questionCard').classList.remove('hidden');$('endCard').classList.add('hidden');render();}
function render(){let q=list()[idx];answered=false;$('category').textContent=q.category;$('qType').textContent=q.type==='mc'?'Choose one answer':'Type your answer';$('prompt').textContent=q.prompt;$('counter').textContent=(idx+1)+' / '+list().length;$('progressFill').style.width=(100*idx/list().length)+'%';$('hintBox').className='box-note hidden';$('feedbackBox').className='box-note hidden';$('hintBox').textContent='';$('feedbackBox').textContent='';$('answerArea').replaceChildren();
  if(q.type==='mc') {let group=document.createElement('div');group.className='options';q.options.forEach((t,n)=>{let label=document.createElement('label');label.className='option';let input=document.createElement('input');input.type='radio';input.name='choice';input.value=String(n);input.checked=mode==='exam'&&examAnswers[idx]===n;let a=document.createElement('span');a.className='optletter';a.textContent='ABC'[n]+'.';let val=document.createElement('span');val.textContent=t;label.append(input,a,val);group.append(label)});$('answerArea').append(group);
  } else {let input=document.createElement('input');input.type='text';input.id='userInput';input.className='typein';input.autocomplete='off';input.spellcheck=false;input.setAttribute('aria-label','Your answer');input.placeholder='Enter the missing phrase';if(mode==='exam'&&typeof examAnswers[idx]==='string')input.value=examAnswers[idx];input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();mode==='practice'?checkPractice():saveAndNext()}});$('answerArea').append(input);let note=document.createElement('div');note.className='under';note.textContent='Type only the missing words or translated fragment.';$('answerArea').append(note)}
  $('hintBtn').classList.toggle('hidden',mode==='exam');$('backBtn').classList.toggle('hidden',mode!=='exam'||idx===0);$('skipBtn').classList.toggle('hidden',mode!=='exam');$('checkBtn').classList.remove('hidden');$('checkBtn').textContent=mode==='exam'?(idx===examBank.length-1?'Finish exam':'Save & next'):'Check answer';$('nextBtn').classList.add('hidden');
}
function notify(msg,kind='bad'){let box=$('feedbackBox');box.textContent=msg;box.className='box-note '+kind;}
function checkPractice(){if(answered)return;let q=list()[idx],value=selected();if(value===null||String(value).trim()===''){notify('Please select or enter an answer.','');return;}let ok=isCorrect(q,value);answered=true;if(ok)score++;let box=$('feedbackBox');box.replaceChildren();box.className='box-note '+(ok?'good':'bad');let title=document.createElement('strong');title.textContent=ok?'✓ Correct!':'Not quite — the expected answer is:';box.append(title);let ans=document.createElement('div');ans.textContent=ok?'':correctAnswer(q);if(!ok)box.append(ans);let why=document.createElement('div');why.textContent=q.explanation;box.append(why);$('checkBtn').classList.add('hidden');$('hintBtn').classList.add('hidden');$('nextBtn').classList.remove('hidden');$('nextBtn').textContent=idx===list().length-1?'See result':'Next →';document.querySelectorAll('input[name="choice"]').forEach(el=>el.disabled=true);let i=$('userInput');if(i)i.disabled=true;}
function saveAndNext(skip=false){let q=list()[idx];if(!skip){let val=selected();if(val===null||String(val).trim()===''){notify('Answer the question or select Skip.','');return;}examAnswers[idx]=val;}else examAnswers[idx]=null; if(idx<examBank.length-1){idx++;render();}else finish();}
function nextPractice(){if(idx<practiceBank.length-1){idx++;render();}else finish();}
function finish(){ $('questionCard').classList.add('hidden');$('endCard').classList.remove('hidden');$('progressFill').style.width='100%';let panel=$('result');panel.replaceChildren();const b=list();const finalScore=mode==='practice'?score:b.reduce((s,q,i)=>s+(isCorrect(q,examAnswers[i])?1:0),0);let summary=document.createElement('div');summary.className='summary';let heading=document.createElement('h2');heading.textContent=mode==='practice'?'Practice complete!':'Exam result';let points=document.createElement('div');points.className='bigscore';points.id='scoreLabel';points.textContent=finalScore+' / '+b.length;let sub=document.createElement('p');sub.className='sub';sub.textContent=mode==='practice'?'Questions with explanations reviewed. Hints used: '+hintCount+'.':'Check the answers below. For an equally valid natural phrase not recognised automatically, you can manually accept your typed answer.';summary.append(heading,points,sub);panel.append(summary);
 if(mode==='exam'){let review=document.createElement('div');review.className='results-list';b.forEach((q,i)=>{let result=isCorrect(q,examAnswers[i]);let card=document.createElement('div');card.className='review';let title=document.createElement('div');title.className='review-title';title.textContent=(i+1)+'. '+q.prompt;let your=document.createElement('div');your.className='review-line your';let answeredVal=examAnswers[i];let selectedText=answeredVal===null||typeof answeredVal==='undefined'?'(skipped)':q.type==='mc'?q.options[answeredVal]:answeredVal;your.textContent='Your answer: '+selectedText;let correct=document.createElement('div');correct.className='review-line '+(result?'answer':'wrong');correct.textContent=(result?'✓ Correct · ':'Suggested answer: ')+correctAnswer(q);card.append(title,your,correct);if(q.type==='text'&&!result&&answeredVal!==null&&typeof answeredVal!=='undefined'){let toggle=document.createElement('button');toggle.className='mark';toggle.type='button';toggle.textContent='My wording is also correct';toggle.addEventListener('click',()=>{overrides[i]=!overrides[i];toggle.textContent=overrides[i]?'✓ Alternative accepted · Undo':'My wording is also correct';let total=examBank.reduce((s,item,k)=>s+(isCorrect(item,examAnswers[k])||overrides[k]?1:0),0);$('scoreLabel').textContent=total+' / '+examBank.length;});card.append(toggle)}review.append(card)});panel.append(review)}
 let wrap=document.createElement('div');wrap.className='act';let again=document.createElement('button');again.className='btn primary';again.textContent='Restart '+(mode==='practice'?'Practice':'Exam');again.onclick=()=>reset(mode);let other=document.createElement('button');other.className='btn';other.textContent=mode==='practice'?'Try Exam Mode':'Go to Practice Mode';other.onclick=()=>reset(mode==='practice'?'exam':'practice');wrap.append(again,other);panel.append(wrap);
}
$('tabPractice').onclick=()=>reset('practice');$('tabExam').onclick=()=>reset('exam');$('restart').onclick=()=>reset(mode);
$('hintBtn').onclick=()=>{let q=practiceBank[idx];if(!$('hintBox').classList.contains('hidden'))return;hintCount++;$('hintBox').textContent='Hint: '+q.hint;$('hintBox').classList.remove('hidden')};
$('checkBtn').onclick=()=>mode==='practice'?checkPractice():saveAndNext();
$('nextBtn').onclick=nextPractice;$('skipBtn').onclick=()=>saveAndNext(true);
$('backBtn').onclick=()=>{let q=list()[idx];let v=selected();if(v!==null&&String(v).trim()!=='')examAnswers[idx]=v;if(idx>0){idx--;render();}};
reset('practice');
</script></body></html>
